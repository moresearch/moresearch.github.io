<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <marker id="tx-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#79c2a0"/>
    </marker>
    <marker id="tx-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#00e080"/>
    </marker>
  </defs>

  <!-- panel 1: feedback -->
  <rect x="22" y="30" width="225" height="350" rx="12" fill="#03170e" stroke="#0d3f2a"/>
  <text x="134" y="60" text-anchor="middle" font-size="13" letter-spacing="1" fill="#79c2a0">FEEDBACK</text>
  <rect x="55" y="95" width="160" height="40" rx="8" fill="#062a19" stroke="#3f7d63"/>
  <text x="135" y="120" text-anchor="middle" font-size="12" fill="#cfe9dc">system</text>
  <rect x="55" y="200" width="160" height="40" rx="8" fill="#062a19" stroke="#3f7d63"/>
  <text x="135" y="225" text-anchor="middle" font-size="12" fill="#cfe9dc">output</text>
  <path d="M100,138 L100,196" stroke="#79c2a0" stroke-width="2" fill="none" marker-end="url(#tx-a)"/>
  <path d="M170,196 L170,140" stroke="#79c2a0" stroke-width="2" fill="none" marker-end="url(#tx-a)"/>
  <g font-size="10.5" fill="#79c2a0" text-anchor="middle">
    <text x="134" y="300">output feeds back</text>
    <text x="134" y="318">into input. Nothing</text>
    <text x="134" y="336">describes the loop.</text>
  </g>

  <!-- panel 2: recursion -->
  <rect x="257" y="30" width="225" height="350" rx="12" fill="#03170e" stroke="#0d3f2a"/>
  <text x="369" y="60" text-anchor="middle" font-size="13" letter-spacing="1" fill="#7dd3fc">RECURSION</text>
  <rect x="285" y="95" width="170" height="170" rx="8" fill="none" stroke="#7dd3fc"/>
  <rect x="307" y="117" width="126" height="126" rx="7" fill="none" stroke="#7dd3fc" opacity="0.75"/>
  <rect x="329" y="139" width="82" height="82" rx="6" fill="none" stroke="#7dd3fc" opacity="0.5"/>
  <rect x="351" y="161" width="38" height="38" rx="5" fill="none" stroke="#7dd3fc" opacity="0.3"/>
  <g font-size="10.5" fill="#7dd3fc" text-anchor="middle">
    <text x="369" y="300">a rule applied to</text>
    <text x="369" y="318">a smaller instance.</text>
    <text x="369" y="336">The ladder stops.</text>
  </g>

  <!-- panel 3: self-reference -->
  <rect x="494" y="30" width="225" height="350" rx="12" fill="#03170e" stroke="#0d3f2a"/>
  <text x="606" y="60" text-anchor="middle" font-size="13" letter-spacing="1" fill="#fbbf24">SELF-REFERENCE</text>
  <rect x="523" y="112" width="166" height="72" rx="8" fill="#241a04" stroke="#fbbf24"/>
  <text x="606" y="142" text-anchor="middle" font-size="11" fill="#cfe9dc">P: &#8220;this sentence</text>
  <text x="606" y="162" text-anchor="middle" font-size="11" fill="#cfe9dc">refers to P&#8221;</text>
  <path d="M689,148 L729,148 L729,88 L606,88 L606,108" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#tx-a)"/>
  <g font-size="10.5" fill="#fbbf24" text-anchor="middle">
    <text x="606" y="300">a representation</text>
    <text x="606" y="318">denotes itself :</text>
    <text x="606" y="336">benign or paradoxical.</text>
  </g>

  <!-- panel 4: strange loop -->
  <rect x="731" y="30" width="225" height="350" rx="12" fill="#03170e" stroke="#0d3f2a"/>
  <text x="843" y="60" text-anchor="middle" font-size="13" letter-spacing="1" fill="#00e080">STRANGE LOOP</text>
  <rect x="768" y="95" width="150" height="34" rx="7" fill="#062a19" stroke="#00e080"/>
  <text x="843" y="117" text-anchor="middle" font-size="11" fill="#cfe9dc">top level</text>
  <rect x="768" y="155" width="150" height="34" rx="7" fill="#062a19" stroke="#1c6b48"/>
  <text x="843" y="177" text-anchor="middle" font-size="11" fill="#79c2a0">middle</text>
  <rect x="768" y="215" width="150" height="34" rx="7" fill="#062a19" stroke="#00e080"/>
  <text x="843" y="237" text-anchor="middle" font-size="11" fill="#cfe9dc">bottom level</text>
  <path d="M843,129 L843,151" stroke="#3f7d63" stroke-width="2" fill="none" marker-end="url(#tx-a)"/>
  <path d="M843,189 L843,211" stroke="#3f7d63" stroke-width="2" fill="none" marker-end="url(#tx-a)"/>
  <path d="M918,232 L944,232 L944,80 L843,80 L843,91" fill="none" stroke="#00e080" stroke-width="2" marker-end="url(#tx-b)"/>
  <g font-size="10.5" fill="#00e080" text-anchor="middle">
    <text x="843" y="300">a representation of</text>
    <text x="843" y="318">the system, which acts</text>
    <text x="843" y="336">on the representation.</text>
  </g>
</svg>
