<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <marker id="al-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#00e080"/>
    </marker>
  </defs>

  <!-- stage: run -->
  <rect x="370" y="24" width="220" height="72" rx="10" fill="#062a19" stroke="#00e080"/>
  <text x="480" y="54" text-anchor="middle" font-size="14" fill="#00f090">1 &#183; RUN</text>
  <text x="480" y="76" text-anchor="middle" font-size="10.5" fill="#79c2a0">the agent does work</text>

  <!-- stage: observe -->
  <rect x="700" y="209" width="220" height="72" rx="10" fill="#062a19" stroke="#00e080"/>
  <text x="810" y="239" text-anchor="middle" font-size="14" fill="#00f090">2 &#183; OBSERVE</text>
  <text x="810" y="261" text-anchor="middle" font-size="10.5" fill="#79c2a0">traces, failures, bottlenecks</text>

  <!-- stage: rewrite -->
  <rect x="370" y="394" width="220" height="72" rx="10" fill="#062a19" stroke="#00e080"/>
  <text x="480" y="424" text-anchor="middle" font-size="14" fill="#00f090">3 &#183; REWRITE</text>
  <text x="480" y="446" text-anchor="middle" font-size="10.5" fill="#79c2a0">author a better tool or policy</text>

  <!-- stage: re-enter -->
  <rect x="40" y="209" width="220" height="72" rx="10" fill="#062a19" stroke="#00e080"/>
  <text x="150" y="239" text-anchor="middle" font-size="14" fill="#00f090">4 &#183; RE-ENTER</text>
  <text x="150" y="261" text-anchor="middle" font-size="10.5" fill="#79c2a0">plug it into its own loop</text>

  <!-- arrows -->
  <path d="M590,60 C720,60 810,124 810,201" fill="none" stroke="#00e080" stroke-width="2.5" marker-end="url(#al-a)"/>
  <path d="M810,281 C810,356 720,430 590,430" fill="none" stroke="#00e080" stroke-width="2.5" marker-end="url(#al-a)"/>
  <path d="M370,430 C240,430 150,356 150,281" fill="none" stroke="#00e080" stroke-width="2.5" marker-end="url(#al-a)"/>
  <path d="M150,209 C150,124 240,60 370,60" fill="none" stroke="#00e080" stroke-width="2.5" marker-end="url(#al-a)"/>

  <!-- centre -->
  <text x="480" y="234" text-anchor="middle" font-size="14" fill="#cfe9dc">the agent becomes</text>
  <text x="480" y="256" text-anchor="middle" font-size="14" fill="#cfe9dc">its own next version</text>

  <!-- trust note -->
  <rect x="40" y="492" width="880" height="52" rx="10" fill="#2a0d0d" stroke="#f87171"/>
  <text x="480" y="514" text-anchor="middle" font-size="11" fill="#f87171">Trusting Trust (Thompson, 1984): a loop that authors its own compiler can plant a defect</text>
  <text x="480" y="532" text-anchor="middle" font-size="11" fill="#f87171">that the compiler will faithfully reproduce in every future build.</text>
</svg>
