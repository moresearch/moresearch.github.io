<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <marker id="dp-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7dd3fc"/>
    </marker>
    <marker id="dp-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#00e080"/>
    </marker>
  </defs>

  <!-- DNA -->
  <rect x="180" y="50" width="540" height="100" rx="14" fill="#041d24" stroke="#7dd3fc"/>
  <text x="450" y="88" text-anchor="middle" font-size="17" fill="#7dd3fc">DNA &#8212; THE BLUEPRINT</text>
  <text x="450" y="114" text-anchor="middle" font-size="11.5" fill="#79c2a0">inert data: it cannot read, copy, or repair itself</text>
  <text x="450" y="134" text-anchor="middle" font-size="11" fill="#4e8f72">a linear tape of nucleotides</text>

  <!-- Protein -->
  <rect x="180" y="300" width="540" height="100" rx="14" fill="#062a19" stroke="#00e080"/>
  <text x="450" y="338" text-anchor="middle" font-size="17" fill="#00e080">PROTEINS &#8212; THE MACHINERY</text>
  <text x="450" y="364" text-anchor="middle" font-size="11.5" fill="#79c2a0">enzymes: polymerases, ribosomes, repair systems</text>
  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#4e8f72">folded chains that do the work</text>

  <!-- down arrow: DNA -> protein -->
  <path d="M258,156 C258,210 258,244 258,292" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#dp-a)"/>
  <text x="240" y="228" text-anchor="middle" font-size="11" fill="#7dd3fc" transform="rotate(-90 240 228)">encodes</text>

  <!-- up arrow: protein -> DNA -->
  <path d="M642,292 C642,244 642,210 642,156" fill="none" stroke="#00e080" stroke-width="2.5" marker-end="url(#dp-b)"/>
  <text x="662" y="228" text-anchor="middle" font-size="11" fill="#00e080" transform="rotate(-90 662 228)">reads, replicates, repairs</text>

  <!-- the knot -->
  <text x="450" y="228" text-anchor="middle" font-size="15" fill="#fbbf24">neither can come first</text>
  <text x="450" y="250" text-anchor="middle" font-size="11" fill="#4e8f72">the chicken-and-egg knot of the origin of life</text>

  <!-- resolution -->
  <rect x="120" y="424" width="660" height="42" rx="10" fill="#041f12" stroke="#0d3f2a"/>
  <text x="450" y="450" text-anchor="middle" font-size="11.5" fill="#79c2a0">RNA can be both template and catalyst &#8212; one molecule that unties the knot (the RNA world).</text>
</svg>
