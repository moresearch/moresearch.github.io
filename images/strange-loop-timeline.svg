<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <marker id="tl-a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f7d63"/>
    </marker>
  </defs>

  <text x="30" y="40" font-size="16" fill="#cfe9dc">One pattern, eight domains: from music and logic to software that rewrites itself</text>

  <line x1="50" y1="210" x2="952" y2="210" stroke="#0d3f2a" stroke-width="2"/>
  <line x1="930" y1="210" x2="950" y2="210" stroke="#3f7d63" stroke-width="2" marker-end="url(#tl-a)"/>

  <!-- above-band labels -->
  <g text-anchor="middle">
    <text x="80" y="178" font-size="13" fill="#cfe9dc">1747</text>
    <text x="80" y="158" font-size="10" fill="#7dd3fc">BACH</text>
    <text x="80" y="143" font-size="10" fill="#79c2a0">Canon per tonos</text>

    <text x="314" y="178" font-size="13" fill="#cfe9dc">1936</text>
    <text x="314" y="158" font-size="10" fill="#00e080">TURING</text>
    <text x="314" y="143" font-size="10" fill="#79c2a0">universal machine</text>

    <text x="548" y="178" font-size="13" fill="#cfe9dc">1951</text>
    <text x="548" y="158" font-size="10" fill="#f472b6">VON NEUMANN</text>
    <text x="548" y="143" font-size="10" fill="#79c2a0">self-reproduction</text>

    <text x="783" y="178" font-size="13" fill="#cfe9dc">1984</text>
    <text x="783" y="158" font-size="10" fill="#f87171">THOMPSON</text>
    <text x="783" y="143" font-size="10" fill="#79c2a0">Trusting Trust</text>
  </g>

  <!-- below-band labels -->
  <g text-anchor="middle">
    <text x="197" y="244" font-size="13" fill="#cfe9dc">1931</text>
    <text x="197" y="265" font-size="10" fill="#00e080">G&#214;DEL</text>
    <text x="197" y="281" font-size="10" fill="#79c2a0">incompleteness</text>

    <text x="431" y="244" font-size="13" fill="#cfe9dc">1940</text>
    <text x="431" y="265" font-size="10" fill="#fbbf24">BOMBE</text>
    <text x="431" y="281" font-size="10" fill="#79c2a0">machine mirrors machine</text>

    <text x="665" y="244" font-size="13" fill="#cfe9dc">1970</text>
    <text x="665" y="265" font-size="10" fill="#a78bfa">CONWAY</text>
    <text x="665" y="281" font-size="10" fill="#79c2a0">Life inside Life</text>

    <text x="900" y="244" font-size="13" fill="#cfe9dc">2023&#8211;26</text>
    <text x="900" y="265" font-size="10" fill="#00f090">AGENTS</text>
    <text x="900" y="281" font-size="10" fill="#79c2a0">rewrite their own tools</text>
  </g>

  <!-- nodes -->
  <g stroke="#03170e" stroke-width="3">
    <circle cx="80" cy="210" r="8" fill="#7dd3fc"/>
    <circle cx="197" cy="210" r="8" fill="#00e080"/>
    <circle cx="314" cy="210" r="8" fill="#00e080"/>
    <circle cx="431" cy="210" r="8" fill="#fbbf24"/>
    <circle cx="548" cy="210" r="8" fill="#f472b6"/>
    <circle cx="665" cy="210" r="8" fill="#a78bfa"/>
    <circle cx="783" cy="210" r="8" fill="#f87171"/>
    <circle cx="900" cy="210" r="8" fill="#00f090"/>
  </g>

  <!-- legend -->
  <g font-size="10" fill="#79c2a0">
    <circle cx="60" cy="372" r="5" fill="#7dd3fc"/><text x="74" y="376">music</text>
    <circle cx="170" cy="372" r="5" fill="#00e080"/><text x="184" y="376">logic / math</text>
    <circle cx="330" cy="372" r="5" fill="#fbbf24"/><text x="344" y="376">hardware</text>
    <circle cx="470" cy="372" r="5" fill="#f472b6"/><text x="484" y="376">self-reproduction</text>
    <circle cx="650" cy="372" r="5" fill="#a78bfa"/><text x="664" y="376">simulation</text>
    <circle cx="790" cy="372" r="5" fill="#f87171"/><text x="804" y="376">security</text>
    <circle cx="900" cy="372" r="5" fill="#00f090"/><text x="914" y="376">agents</text>
  </g>
</svg>
