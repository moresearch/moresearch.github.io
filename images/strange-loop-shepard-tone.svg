<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <marker id="st-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="16" fill="#cfe9dc">The Shepard tone: six rising steps that return to the octave</text>

  <!-- staircase -->
  <polyline points="60,360 60,315 150,315 150,270 240,270 240,225 330,225 330,180 420,180 420,135 510,135 510,90 600,90 600,45 690,45"
            fill="none" stroke="#00e080" stroke-width="3" stroke-linejoin="round"/>

  <!-- pitch-class labels -->
  <g font-size="13" fill="#cfe9dc" text-anchor="middle">
    <text x="105" y="306">C</text>
    <text x="195" y="261">D</text>
    <text x="285" y="216">E</text>
    <text x="375" y="171">F&#9839;</text>
    <text x="465" y="126">G&#9839;</text>
    <text x="555" y="81">A&#9839;</text>
    <text x="645" y="36">C</text>
  </g>

  <!-- perceptual wrap-around -->
  <path d="M690,45 H730 V415 H30 V360 H54" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#st-a)"/>
  <text x="380" y="446" text-anchor="middle" font-size="11.5" fill="#fbbf24">the sequence folds back to its start, yet the ear hears an endless ascent</text>

  <!-- annotation -->
  <g font-size="11.5" fill="#79c2a0">
    <text x="756" y="150">Each repeat enters one whole</text>
    <text x="756" y="168">step higher. The tone is a stack</text>
    <text x="756" y="186">of octave-spaced sine components</text>
    <text x="756" y="204">under a fixed bell-shaped</text>
    <text x="756" y="222">envelope, so the top of the</text>
    <text x="756" y="240">staircase has the same spectral</text>
    <text x="756" y="258">shape as the bottom. Pitch</text>
    <text x="756" y="276">height rises; pitch class does</text>
    <text x="756" y="294">not. The loop is in the listening.</text>
  </g>
</svg>
