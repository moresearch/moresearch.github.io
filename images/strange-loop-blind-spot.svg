<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
  <text x="360" y="40" text-anchor="middle" font-size="13" letter-spacing="1" fill="#00e080">THE LOOP ENABLES</text>
  <text x="740" y="40" text-anchor="middle" font-size="13" letter-spacing="1" fill="#f87171">THE BLIND SPOT</text>
  <line x1="505" y1="58" x2="505" y2="420" stroke="#0d3f2a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- row 1 -->
  <text x="30" y="106" font-size="11" fill="#00e080">G&#214;DEL 1931</text>
  <rect x="205" y="82" width="310" height="48" rx="8" fill="#03170e" stroke="#0d3f2a"/>
  <text x="215" y="111" font-size="10" fill="#cfe9dc">arithmetic that proves things about arithmetic</text>
  <rect x="525" y="82" width="425" height="48" rx="8" fill="#1c0d0d" stroke="#5c1f1f"/>
  <text x="535" y="111" font-size="10" fill="#f87171">cannot prove its own consistency</text>

  <!-- row 2 -->
  <text x="30" y="174" font-size="11" fill="#00e080">TURING 1936</text>
  <rect x="205" y="150" width="310" height="48" rx="8" fill="#03170e" stroke="#0d3f2a"/>
  <text x="215" y="179" font-size="10" fill="#cfe9dc">a machine that runs any machine's description</text>
  <rect x="525" y="150" width="425" height="48" rx="8" fill="#1c0d0d" stroke="#5c1f1f"/>
  <text x="535" y="179" font-size="10" fill="#f87171">cannot decide whether it halts</text>

  <!-- row 3 -->
  <text x="30" y="242" font-size="11" fill="#f87171">THOMPSON 1984</text>
  <rect x="205" y="218" width="310" height="48" rx="8" fill="#03170e" stroke="#0d3f2a"/>
  <text x="215" y="247" font-size="10" fill="#cfe9dc">a compiler that compiles its own source</text>
  <rect x="525" y="218" width="425" height="48" rx="8" fill="#1c0d0d" stroke="#5c1f1f"/>
  <text x="535" y="247" font-size="10" fill="#f87171">cannot verify its own provenance</text>

  <!-- row 4 -->
  <text x="30" y="310" font-size="11" fill="#00f090">AGENTS 2023&#8211;</text>
  <rect x="205" y="286" width="310" height="48" rx="8" fill="#03170e" stroke="#0d3f2a"/>
  <text x="215" y="315" font-size="10" fill="#cfe9dc">an agent that rewrites its own tools</text>
  <rect x="525" y="286" width="425" height="48" rx="8" fill="#1c0d0d" stroke="#5c1f1f"/>
  <text x="535" y="315" font-size="10" fill="#f87171">cannot validate the signal it optimizes against</text>

  <!-- row 5 -->
  <text x="30" y="378" font-size="11" fill="#a78bfa">MINDS ?</text>
  <rect x="205" y="354" width="310" height="48" rx="8" fill="#03170e" stroke="#0d3f2a"/>
  <text x="215" y="383" font-size="10" fill="#cfe9dc">a brain that models the modeler</text>
  <rect x="525" y="354" width="425" height="48" rx="8" fill="#1c0d0d" stroke="#5c1f1f"/>
  <text x="535" y="383" font-size="10" fill="#f87171">cannot explain why the model feels like anything</text>

  <text x="490" y="446" text-anchor="middle" font-size="11" fill="#79c2a0">The power to describe yourself and the limit you cannot see past are the same fact.</text>
</svg>
