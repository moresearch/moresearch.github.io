<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <marker id="sl-a1" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3f7d63"/>
    </marker>
    <marker id="sl-a2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#00e080"/>
    </marker>
  </defs>

  <!-- LEFT: strict hierarchy -->
  <rect x="16" y="16" width="448" height="398" rx="14" fill="#03170e" stroke="#0d3f2a"/>
  <text x="240" y="48" text-anchor="middle" font-size="16" letter-spacing="2" fill="#79c2a0">STRICT HIERARCHY</text>

  <g>
    <rect x="110" y="72" width="260" height="54" rx="8" fill="#062a19" stroke="#1c6b48"/>
    <text x="240" y="95" text-anchor="middle" font-size="14" fill="#cfe9dc">TOP LEVEL</text>
    <text x="240" y="114" text-anchor="middle" font-size="11.5" fill="#79c2a0">writes the rules</text>

    <rect x="110" y="148" width="260" height="54" rx="8" fill="#062a19" stroke="#1c6b48"/>
    <text x="240" y="171" text-anchor="middle" font-size="14" fill="#cfe9dc">LEVEL 2</text>
    <text x="240" y="190" text-anchor="middle" font-size="11.5" fill="#79c2a0">applies the rules</text>

    <rect x="110" y="224" width="260" height="54" rx="8" fill="#062a19" stroke="#1c6b48"/>
    <text x="240" y="247" text-anchor="middle" font-size="14" fill="#cfe9dc">LEVEL 3</text>
    <text x="240" y="266" text-anchor="middle" font-size="11.5" fill="#79c2a0">shapes the data</text>

    <rect x="110" y="300" width="260" height="54" rx="8" fill="#062a19" stroke="#1c6b48"/>
    <text x="240" y="323" text-anchor="middle" font-size="14" fill="#cfe9dc">BOTTOM LEVEL</text>
    <text x="240" y="342" text-anchor="middle" font-size="11.5" fill="#79c2a0">obeys the rules</text>
  </g>

  <path d="M240,129 L240,145" stroke="#3f7d63" stroke-width="2" fill="none" marker-end="url(#sl-a1)"/>
  <path d="M240,205 L240,221" stroke="#3f7d63" stroke-width="2" fill="none" marker-end="url(#sl-a1)"/>
  <path d="M240,281 L240,297" stroke="#3f7d63" stroke-width="2" fill="none" marker-end="url(#sl-a1)"/>

  <text x="240" y="386" text-anchor="middle" font-size="11.5" fill="#4e8f72">information flows one level down; the boundary holds</text>

  <!-- RIGHT: strange loop -->
  <rect x="496" y="16" width="448" height="398" rx="14" fill="#03170e" stroke="#0d3f2a"/>
  <text x="720" y="48" text-anchor="middle" font-size="16" letter-spacing="2" fill="#00e080">STRANGE LOOP</text>

  <g>
    <rect x="590" y="72" width="260" height="54" rx="8" fill="#062a19" stroke="#00e080"/>
    <text x="720" y="95" text-anchor="middle" font-size="14" fill="#cfe9dc">TOP LEVEL</text>
    <text x="720" y="114" text-anchor="middle" font-size="11.5" fill="#79c2a0">writes the rules</text>

    <rect x="590" y="148" width="260" height="54" rx="8" fill="#062a19" stroke="#1c6b48"/>
    <text x="720" y="171" text-anchor="middle" font-size="14" fill="#cfe9dc">LEVEL 2</text>
    <text x="720" y="190" text-anchor="middle" font-size="11.5" fill="#79c2a0">applies the rules</text>

    <rect x="590" y="224" width="260" height="54" rx="8" fill="#062a19" stroke="#1c6b48"/>
    <text x="720" y="247" text-anchor="middle" font-size="14" fill="#cfe9dc">LEVEL 3</text>
    <text x="720" y="266" text-anchor="middle" font-size="11.5" fill="#79c2a0">shapes the data</text>

    <rect x="590" y="300" width="260" height="54" rx="8" fill="#062a19" stroke="#00e080"/>
    <text x="720" y="323" text-anchor="middle" font-size="14" fill="#cfe9dc">BOTTOM LEVEL</text>
    <text x="720" y="342" text-anchor="middle" font-size="11.5" fill="#79c2a0">obeys the rules</text>
  </g>

  <path d="M720,129 L720,145" stroke="#3f7d63" stroke-width="2" fill="none" marker-end="url(#sl-a1)"/>
  <path d="M720,205 L720,221" stroke="#3f7d63" stroke-width="2" fill="none" marker-end="url(#sl-a1)"/>
  <path d="M720,281 L720,297" stroke="#3f7d63" stroke-width="2" fill="none" marker-end="url(#sl-a1)"/>

  <path d="M590,327 C468,327 468,99 582,99" stroke="#00e080" stroke-width="2.5" fill="none" marker-end="url(#sl-a2)"/>
  <text x="514" y="213" text-anchor="middle" font-size="11" fill="#00e080" transform="rotate(-90 514 213)">the output becomes the rule</text>

  <text x="720" y="386" text-anchor="middle" font-size="11.5" fill="#00e080">the bottom level rewrites the top; boundaries dissolve</text>
</svg>
